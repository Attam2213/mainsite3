<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Страница не найдена — Wexa.su</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #3b0764 100%);
        color: #fff;
      }
      .card { max-width: 480px; width: 100%; text-align: center; }
      .code {
        font-size: 96px;
        font-weight: 900;
        line-height: 1;
        background: linear-gradient(135deg, #818cf8, #c084fc);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 16px;
      }
      h1 { font-size: 28px; margin: 0 0 12px; }
      p { color: #cbd5e1; line-height: 1.6; margin: 0 0 32px; }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 28px;
        border-radius: 12px;
        font-weight: 700;
        color: #fff;
        text-decoration: none;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        box-shadow: 0 10px 30px rgba(99, 102, 241, 0.35);
      }
      a:hover { filter: brightness(1.08); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1>Страница не найдена</h1>
      <p>К сожалению, страница, которую вы ищете, не существует или была перемещена.</p>
      <a href="/">← Вернуться на главную</a>
    </div>
  </body>
</html>
